name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v6

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Compilar com avisos rigorosos
        run: |
          mkdir -p build
          javac -encoding UTF-8 -Xlint:all -Werror -d build \
            $(find src/main/java src/test/java -name '*.java' -print)

      - name: Testar persistência
        run: java -cp build br.com.darkramuza.tarefas.RepositorioTarefasTeste
